name: Native Mac checks
on:
  push:
    branches: [implementation/native-mac]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          uname -m
          xcodebuild -version
          test "$(uname -m)" = arm64
      - name: Build pinned native app
        run: scripts/build.sh
      - name: Run acceptance checks
        run: scripts/test.sh
      - name: Retain observed logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ github.sha }}
          path: harness/logs
