name: Native Mac checks
on:
  push:
    branches: [main, implementation/native-mac]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          uname -m
          xcodebuild -version
          test "$(uname -m)" = arm64
      # Advisory: swift-format output differs between toolchain versions and this
      # image's Xcode is not pinned to the version the sources were formatted with.
      - name: Lint Swift layout (advisory)
        continue-on-error: true
        run: scripts/swift-format.sh lint
      - name: Build pinned native app
        run: scripts/build.sh
      - name: Run acceptance checks
        run: scripts/test.sh
      - name: Retain observed logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ github.sha }}
          path: harness/logs
