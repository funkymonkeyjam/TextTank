name: Native Mac checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: native
            runner: xcode-27
            xcode: '27.2'
            advisory: false
          - check: native-advisory-16.4
            runner: macos-15
            xcode: '16.4'
            advisory: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 45
    env:
      TEXTTANK_PERF_BUDGET_SCALE: 3
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      XCODE_VERSION: ${{ matrix.xcode }}
      TEXTTANK_WARNINGS_AS_ERRORS: ${{ matrix.advisory && '0' || '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (upstream tag verified)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select the verified CI toolchain
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Configure advisory Swift builds
        if: matrix.advisory
        run: |
          # Xcode project settings take precedence over ordinary shell variables.
          config="$RUNNER_TEMP/advisory.xcconfig"
          echo 'SWIFT_TREAT_WARNINGS_AS_ERRORS = NO' > "$config"
          echo "XCODE_XCCONFIG_FILE=$config" >> "$GITHUB_ENV"
      - name: Record candidate and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "$CANDIDATE_SHA"
          git rev-parse HEAD^{tree}
          uname -m
          xcodebuild -version
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | head -n 1)" = "Xcode $XCODE_VERSION"
      # swift-format output differs between toolchain versions.
      - name: Lint Swift layout (advisory)
        continue-on-error: true
        run: scripts/swift-format.sh lint
      - name: Verify generated project is current
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- TextTank.xcodeproj
      - name: Build pinned native app
        run: |
          if [[ "$TEXTTANK_WARNINGS_AS_ERRORS" == 0 ]]; then
            scripts/build.sh --advisory-swift-warnings
          else
            scripts/build.sh
          fi
      - name: Run acceptance checks
        id: acceptance
        run: scripts/test.sh
      - name: Full performance tier (advisory, reduced tier gates acceptance)
        continue-on-error: true
        run: scripts/test-performance.sh
      - name: Static analyzer
        run: xcodebuild -project TextTank.xcodeproj -scheme TextTank -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO analyze
      - name: Retain observed logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (upstream tag verified)
        with:
          name: native-evidence-${{ matrix.xcode }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness/logs
      - name: Report acceptance outcome
        if: always()
        run: echo "Xcode $XCODE_VERSION acceptance on $CANDIDATE_SHA — ${{ steps.acceptance.outcome }}" >> "$GITHUB_STEP_SUMMARY"
